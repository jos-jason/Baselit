# Builds the Flutter app for Linux (x86-64) and publishes it as the
# "linux-latest" pre-release, so there's always a download for the newest main.
name: Flutter Linux build

on:
  push:
    branches: [main]
    paths:
      - "baselit_flutter/**"
      - ".github/workflows/flutter-linux.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: baselit_flutter
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5

      - name: Build
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package
        run: |
          mkdir -p dist/baselit-linux-x64
          cp -r build/linux/x64/release/bundle/. dist/baselit-linux-x64/
          cp linux/packaging/install.sh linux/packaging/baselit.png dist/baselit-linux-x64/
          tar -C dist -czf baselit-linux-x64.tar.gz baselit-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: baselit-linux-x64
          path: baselit_flutter/baselit-linux-x64.tar.gz

      - name: Publish the linux-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete linux-latest --yes --cleanup-tag || true
          gh release create linux-latest baselit-linux-x64.tar.gz \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Baselit for Linux (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download, unpack, and run ./install.sh inside the folder."
